

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>completeprofile</title>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    


     <div class="auth_page">
        <div class="wrapper complete_profile">

            <div class="logo">
                <img src="./images/logo_auth.png" alt="">
            </div>

            <div class="form_box">
                <form action="" method="POST">

                     <h2>إنشاء حساب جديد</h2>

                     <div class="stepper mx-0 mx-md-5">
                        <div class="step ">
                            <div class="circle" style="background-color: #F5932E;">
                                <svg width="17" height="16" viewBox="0 0 17 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M15.1673 7.38723V8.00056C15.1665 9.43818 14.701 10.837 13.8402 11.9884C12.9794 13.1399 11.7695 13.9822 10.3909 14.3898C9.01227 14.7974 7.53882 14.7485 6.1903 14.2503C4.84177 13.7521 3.69042 12.8313 2.90796 11.6253C2.1255 10.4192 1.75385 8.9926 1.84844 7.5581C1.94303 6.1236 2.49879 4.75811 3.43284 3.66528C4.36689 2.57244 5.62917 1.81082 7.03144 1.49399C8.43371 1.17717 9.90083 1.32212 11.214 1.90723" stroke="white" stroke-width="1.66667" stroke-linecap="round" stroke-linejoin="round"/>

                                </svg>
                            </div>
                            <div class="label">البيانات الأساسية</div>
                        </div>
                        <div class="line"></div>
                        <div class="step active">
                            <div class="circle">
                                <svg width="17" height="16" viewBox="0 0 17 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M15.1673 7.38723V8.00056C15.1665 9.43818 14.701 10.837 13.8402 11.9884C12.9794 13.1399 11.7695 13.9822 10.3909 14.3898C9.01227 14.7974 7.53882 14.7485 6.1903 14.2503C4.84177 13.7521 3.69042 12.8313 2.90796 11.6253C2.1255 10.4192 1.75385 8.9926 1.84844 7.5581C1.94303 6.1236 2.49879 4.75811 3.43284 3.66528C4.36689 2.57244 5.62917 1.81082 7.03144 1.49399C8.43371 1.17717 9.90083 1.32212 11.214 1.90723" stroke="white" stroke-width="1.66667" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M6.5 7.33268L8.5 9.33268L15.1667 2.66602" stroke="white" stroke-width="1.66667" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </div>
                            <div class="label">التحقق من الهوية</div>
                        </div>
                        <div class="line"></div>
                        <div class="step active">
                            <div class="circle">
                                <svg width="17" height="16" viewBox="0 0 17 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M15.1673 7.38723V8.00056C15.1665 9.43818 14.701 10.837 13.8402 11.9884C12.9794 13.1399 11.7695 13.9822 10.3909 14.3898C9.01227 14.7974 7.53882 14.7485 6.1903 14.2503C4.84177 13.7521 3.69042 12.8313 2.90796 11.6253C2.1255 10.4192 1.75385 8.9926 1.84844 7.5581C1.94303 6.1236 2.49879 4.75811 3.43284 3.66528C4.36689 2.57244 5.62917 1.81082 7.03144 1.49399C8.43371 1.17717 9.90083 1.32212 11.214 1.90723" stroke="white" stroke-width="1.66667" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M6.5 7.33268L8.5 9.33268L15.1667 2.66602" stroke="white" stroke-width="1.66667" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </div>
                            <div class="label">إكمال الملف</div>
                        </div>
                    </div>

                    <p class="complete_info">أكمل بياناتك لتتمكن من استخدام جميع خدمات المنصة</p>

                    <div class="upload_image">
                        <label class="file-label">الصورة الشخصية (اختياري)</label>

                        <label class="upload-box" for="fileInput">
                            <button class="upload-btn">اختر الملفات</button>
                            <div class="upload-text">
                                <span>قم بسحب وإفلات الملفات هنا</span>
                                <svg width="51" height="51" viewBox="0 0 51 51" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <g clip-path="url(#clip0_2116_332)">
                                <g clip-path="url(#clip1_2116_332)">
                                <path d="M39.0762 23.5742C39.0762 23.457 39.0957 23.3399 39.0957 23.2227C39.0957 16.875 34.0371 11.7383 27.7969 11.7383C23.2949 11.7383 19.4277 14.4141 17.6113 18.2813C16.8203 17.8809 15.9316 17.6465 14.9941 17.6465C12.1133 17.6465 9.71094 19.7852 9.25195 22.5781C5.79492 23.7696 3.32422 27.0801 3.32422 30.9766C3.32422 35.8789 7.24024 39.8633 12.0644 39.8633H22.0742V32.0508H17.3672L25.1992 23.877L33.0312 32.041H28.3242V39.8535H39.0957C43.5097 39.8535 47.0742 36.1914 47.0742 31.709C47.0742 27.2266 43.4902 23.584 39.0762 23.5742Z" fill="#F5932E"/>
                                </g>
                                </g>
                                <defs>
                                <clipPath id="clip0_2116_332">
                                <rect width="50" height="50" fill="white" transform="translate(0.199219 0.800781)"/>
                                </clipPath>
                                <clipPath id="clip1_2116_332">
                                <rect width="50" height="50" fill="white" transform="translate(0.199219 0.800781)"/>
                                </clipPath>
                                </defs>
                                </svg>
                            </div>
                            <input type="file" id="fileInput" accept=".jpg,.jpeg,.png" multiple>
                        </label>

                        <div class="file-note">jpg,jpeg,png</div>
                    </div>
                   

                    <div class="input_group">
                        <label for="full_address">العنوان الكامل*</label>
                        <input type="text" name="full_address" id="full_address" placeholder="أدخل العنوان التفصيلي" required>
                    </div>

                    <div class="row">
                         <div class="col-md-6">
                            <div class="input_group">
                                <label for="area">المنطقة</label>
                                <select name="area" id="area" required>
                                    <option value="" disabled selected>المنطقة</option>
                                    <option value="riyadh">الرياض</option>
                                    <option value="jeddah">جدة</option>
                                    <option value="dammam">الدمام</option>
                                    <option value="makkah">مكة المكرمة</option>
                                    <option value="madinah">المدينة المنورة</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="input_group">
                                <label for="city">المدينة</label>
                                <select name="city" id="city" required>
                                    <option value="" disabled selected>المدينة</option>
                                    <option value="riyadh">الرياض</option>
                                    <option value="riyadh">الرياض</option>
                                    <option value="jeddah">جدة</option>
                                    <option value="dammam">الدمام</option>
                                    <option value="makkah">مكة المكرمة</option>
                                    <option value="madinah">المدينة المنورة</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="location_area">
                        
                        <div class="click">
                            <svg width="32" height="33" viewBox="0 0 32 33" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M26.6654 13.5339C26.6654 21.5339 15.9987 29.5339 15.9987 29.5339C15.9987 29.5339 5.33203 21.5339 5.33203 13.5339C5.33203 10.7049 6.45584 7.99177 8.45623 5.99138C10.4566 3.99099 13.1697 2.86719 15.9987 2.86719C18.8277 2.86719 21.5408 3.99099 23.5412 5.99138C25.5416 7.99177 26.6654 10.7049 26.6654 13.5339Z" stroke="#9CA3AF" stroke-width="2.66667" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M16 17.5312C18.2091 17.5312 20 15.7404 20 13.5312C20 11.3221 18.2091 9.53125 16 9.53125C13.7909 9.53125 12 11.3221 12 13.5312C12 15.7404 13.7909 17.5312 16 17.5312Z" stroke="#9CA3AF" stroke-width="2.66667" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                            <p>انقر لتحديد الموقع على الخريطة</p>
                        </div>

                    </div>

                    <div class="input_group">
                        <label for="payment_method">وسيلة الدفع الفضلة</label>
                        <select name="payment_method" id="payment_method" required>
                            <option value="" disabled selected>اختر وسيلة الدفع</option>
                            <option value="paypal">paypal</option>
                            <option value="visa">Visa</option>
                        </select>
                    </div>

                    <button type="submit" class="main_bg">إنشاء الحساب</button>


                    <a href="#" class="back_step mt-0">
                        <svg width="17" height="17" viewBox="0 0 17 17" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M13.832 8.5H3.16537M3.16537 8.5L7.16536 4.5M3.16537 8.5L7.16536 12.5" stroke="#0C0C0C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        السابق
                    </a>

                </form>
            </div>

        </div>

        <img src="./images/bg_auth.png" alt="" class="bg_auth d-none d-lg-block">

    </div>






</body>
</html>
