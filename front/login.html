<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>
<body>





    <div class="auth_page">
        <div class="wrapper login">

            <div class="logo">
                <img src="./images/logo_auth.png" alt="">
            </div>

            <div class="form_box ">
                <form action="" method="POST">
                    <h2>تسجيل الدخول</h2>
                    <p class="welcome_back">أهلاً بك من جديد! يُرجى تسجيل الدخول للمتابعة.</p>
                    
                    <div class="input_group">
                        <label for="email">البريد الالكتروني</label>
                        <input type="email" name="email" id="email" placeholder="البريد الالكتروني"  required>
                    </div>
                    <div class="input_group">
                        <label for="password">كلمة المرور</label>
                        <input type="password" name="password" id="password" placeholder="كلمة المرور"  required>
                    </div>

                    <div class="forget_password">
                        <a href="#">نسيت كلمة المرور الخاصة بك</a>
                    </div>

                    <button type="submit">تسجيل الدخول</button>

                </form>
            </div>

            <div class="go_signup">
                <p>ليس لديك حساب؟ <a href="#">قم بالتسجيل الان</a> </p>
            </div>

            <div class="or">او</div>

            <a href="#" class="login_provider">سجل كمزود خدمة</a>

            <p class="tip px-2 px-md-0" >من خلال الاستمرار، فإنك توافق على شروط الخدمة وسياسة الخصوصية الخاصة بـ روابط الاعمار وتوافق على تلقي رسائل بريد إلكتروني دورية تحتوي على التحديثات.</p>

        </div>
        <img src="./images/bg_auth.png" alt="" class="bg_auth d-none d-lg-block">
    </div>


    

    
    
</body>
</html>
