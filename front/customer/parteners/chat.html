
<!DOCTYPE html>

                    <h6>منصة المقاولين</h6>

                </div>
            </div>
            <div class="close_bar">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M6 2L6 14M5.2 2L10.8 2C11.9201 2 12.4802 2 12.908 2.21799C13.2843 2.40973 13.5903 2.71569 13.782 3.09202C14 3.51984 14 4.0799 14 5.2L14 10.8C14 11.9201 14 12.4802 13.782 12.908C13.5903 13.2843 13.2843 13.5903 12.908 13.782C12.4802 14 11.9201 14 10.8 14L5.2 14C4.07989 14 3.51984 14 3.09202 13.782C2.71569 13.5903 2.40973 13.2843 2.21799 12.908C2 12.4802 2 11.9201 2 10.8L2 5.2C2 4.07989 2 3.51984 2.21799 3.09202C2.40973 2.71569 2.71569 2.40973 3.09202 2.21799C3.51984 2 4.0799 2 5.2 2Z" stroke="#111111" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>      
            </div>
            <div class="input_group">
                <input type="search" name="project-search" placeholder="...البحث في المشاريع والعروض">
                <div class="search_icon">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M9.16667 15.8333C12.8486 15.8333 15.8333 12.8486 15.8333 9.16667C15.8333 5.48477 12.8486 2.5 9.16667 2.5C5.48477 2.5 2.5 5.48477 2.5 9.16667C2.5 12.8486 5.48477 15.8333 9.16667 15.8333Z" stroke="#9CA3AF" stroke-width="1.66667" stroke-linecap="round" stroke-linejoin="round"/>

        <div class="right">
            <a href="add-project/project-step.html" class="add_project_btn main_btn_bg">
                <span>مشروع جديد</span>
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M7.9987 3.33203V12.6654M3.33203 7.9987H12.6654" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

            <div class="user">

                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12.6654 14V12.6667C12.6654 11.9594 12.3844 11.2811 11.8843 10.781C11.3842 10.281 10.7059 10 9.9987 10H5.9987C5.29145 10 4.61318 10.281 4.11308 10.781C3.61298 11.2811 3.33203 11.9594 3.33203 12.6667V14" stroke="#3C3F47" stroke-width="1.33333" stroke-linecap="round" stroke-linejoin="round"/>

                </div>
                <a href="#" class="name">
                    <h6>أحمد الراشد</h6>
                    <p class="email">AhmedR1@mail.com</p>
                </a>
                <div class="icon">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M4 6L8 10L12 6" stroke="#6B7280" stroke-width="1.33333" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
            </div>

    <aside>
        <ul>
            <li>
                <a href="#">
                    <span>لوحة التحكم</span>
                    <i class="fa-regular fa-house"></i>
                </a>
            </li>
            <li>
                <a href="#">
                    <span>مشاريعي</span>
                    <i class="fa-regular fa-folder-open"></i>
                </a>
            </li>
            <li>
                <a href="#">
                    <span>المدفوعات</span>
                    <i class="fa-regular fa-credit-card"></i>
                </a>
            </li>
            <li>
                <a href="#">
                    <span>الإشعارات</span>
                    <i class="fa-regular fa-bell"></i>
                </a>
            </li>
        </ul>

        <button class="logout">
            <span>تسجيل الخروج</span>
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
        </button>
    </aside>


    <div class="partners chat">
        <div id="chatModal" class="chat-modal">
            <div class="container">
                <div class="chat-content">
                    <a href="#" class="close" onclick="closeChat()">&times;</a>

                    <div class="chat-messages" id="chatMessages">
                        <div class="msg bot">
                            <p><strong>قسم المشتريات:</strong> أهلاً بك 👋 كيف نقدر نساعدك؟</p>
                        </div>
                    </div>

                    <div class="chat-input">
                        <input type="text" id="userMessage" placeholder="اكتب رسالتك...">
                        <button onclick="sendMessage()">إرسال</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    


    <script src="../../../public/assets/js/customer/chat.js"></script>
