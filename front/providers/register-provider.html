<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rejister Providers</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../style.css">


</head>
<body>



      <div class="auth_page">
        <div class="wrapper rejester">

            <div class="logo">
                <img src="../images/logo_auth.png" alt="">
            </div>

             <div class="form_box ">
                <form action="" method="POST">
                    <h2>إنشاء حساب جديد كمزود خدمة</h2>

                    <!-- Stepper -->
                    <div class="stepper  mx-0 mx-md-5">
                        <div class="step active">
                            <div class="circle">1</div>
                            <div class="label">البيانات الأساسية</div>
                        </div>
                        <div class="line"></div>
                        <div class="step">
                            <div class="circle">2</div>
                            <div class="label">رفع الستندات الرسمية</div>
                        </div>
                        <div class="line"></div>
                        <div class="step">
                            <div class="circle">3</div>
                            <div class="label">تحديد مجالات التخصص</div>
                        </div>
                    </div>

                    <div class="input_group">
                        <label for="company_name">*اسم الشركة/المؤسسة</label>
                        <input type="text" name="company_name" id="company_name" placeholder="اسم الشركة/المؤسسة" required>
                    </div>
                    <div class="input_group">
                        <label for="legal_entity_type">نوع الكيان القانوني*</label>
                        <select name="legal_entity_type" id="legal_entity_type" required >
                            <option value="" disabled selected >نوع الكيان</option>
                            <option value="1">test 1</option>
                            <option value="2">test_2</option>
                            <option value="1">test_3</option>
                        </select>
                    </div>

                    <div class="row">
                        <div class="col-6">
                            <div class="input_group">
                                <label for="owner_id">*رقم الهوية/القامة للمالك</label>
                                <select name="owner_id" id="owner_id" required >
                                    <option value="" disabled selected>1234567890</option>
                                    <option value="1">test 1</option>
                                    <option value="2">test_2</option>
                                    <option value="3">test_3</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="input_group">
                                <label for="commercial_registration">*رقم السجل التجاري</label>
                                <select name="commercial_registration" id="commercial_registration" required >
                                    <option value="" disabled selected >1234567890</option>
                                    <option value="1">test 1</option>
                                    <option value="2">test_2</option>
                                    <option value="3">test_3</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="input_group">
                        <label for="phone_number">رقم الهاتف المحمول*</label>
                        <input type="text" name="phone_number" id="phone_number" placeholder="+966 50 123 4567" required >
                        <button class="confirm_phone">التحقق من الهاتف المحمول</button>
                    </div>
                    <div class="input_group">
                        <label for="email">البريد الإلكتروني*</label>
                        <input type="email" name="email" id="email" placeholder="example@mail.com" required >
                    </div>
                    <div class="input_group">
                        <label for="full_address">*العنوان الكامل</label>
                        <input type="text" name="full_address" id="full_address" placeholder="أدخل العنوان التفصيلي" required >
                    </div>
                    <div class="row">
                         <div class="col-md-6">
                            <div class="input_group">
                                <label for="area">المنطقة</label>
                                <select name="region_id" id="area" required>
                                    <option value="" disabled selected>المنطقة</option>
                                    <option value="riyadh">الرياض</option>
                                    <option value="jeddah">جدة</option>
                                    <option value="dammam">الدمام</option>
                                    <option value="makkah">مكة المكرمة</option>
                                    <option value="madinah">المدينة المنورة</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="input_group">
                                <label for="city">المدينة</label>
                                <select name="city_id" id="city" required>
                                    <option value="" disabled selected>المدينة</option>
                                    <option value="riyadh">الرياض</option>
                                    <option value="riyadh">الرياض</option>
                                    <option value="jeddah">جدة</option>
                                    <option value="dammam">الدمام</option>
                                    <option value="makkah">مكة المكرمة</option>
                                    <option value="madinah">المدينة المنورة</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="agree_terms">
                        <label for="agree_terms">
                            <p>أوافق علي  <a href="#">شرو وأحكام المنصة</a></p>
                        </label>
                        <input class="form-check-input" type="checkbox" id="agree_terms" name="agree_terms" required>
                    </div>

                    <button type="submit" class="main_bg">التالي - التحقق من الهوية</button>


                </form>
            </div>

            <p class="hava_account mt-3">
                لديك حساب بالفعل؟  <a href="#">قم بتسجيل الدخول</a>
            </p>


        </div>
        <img src="../images/bg_auth.png" alt="" class="bg_auth d-none d-lg-block">

    </div>


    
</body>
</html>
